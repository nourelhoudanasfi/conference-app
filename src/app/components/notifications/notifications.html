<section class="section section--orange">
  <div class="icon-circle icon-orange">🔔</div>
  <div>
    <h2>Zone de notifications</h2>
    <p>Vous avez {{ notifications.length }} nouvelles notifications.</p>
    <button (click)="toggle()">
      {{ showList() ? 'Masquer les notifications' : 'Afficher les notifications' }}
    </button>
    @if (showList()) {
      <ul>
        @for (n of notifications; track n) {
          <li>{{ n }}</li>
        }
      </ul>
    }
  </div>
</section>
